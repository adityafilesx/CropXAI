# ─── Data Augmentation Pipeline Configuration ─────────────────────────────────
# All augmentations are applied only to the training split.
# Each augmentation has an `enabled` flag and `p` (probability [0, 1]).

enabled: true
apply_to_splits: [train]      # Only augment training data

# ─── Geometric Augmentations ──────────────────────────────────────────────────
horizontal_flip:
  enabled: true
  p: 0.5

vertical_flip:
  enabled: true
  p: 0.5

random_rotation:
  enabled: true
  p: 0.5
  limit: 30                   # Max rotation in degrees (±30)
  interpolation: bilinear
  border_mode: reflect

random_crop:
  enabled: true
  p: 0.3
  height: 192                 # Crop then resize back to patch_size
  width: 192

random_scale:
  enabled: true
  p: 0.3
  scale_limit: 0.2            # Scale factor in range [1-limit, 1+limit]
  interpolation: bilinear

# ─── Radiometric Augmentations ────────────────────────────────────────────────
brightness:
  enabled: true
  p: 0.4
  limit: 0.2                  # Brightness adjustment range

contrast:
  enabled: true
  p: 0.4
  limit: 0.2                  # Contrast adjustment range

# ─── Noise Augmentations ──────────────────────────────────────────────────────
gaussian_noise:
  enabled: true
  p: 0.3
  var_limit: [10.0, 50.0]     # Variance range for Gaussian noise

random_blur:
  enabled: true
  p: 0.2
  blur_limit: [3, 7]          # Kernel size range (odd numbers)
